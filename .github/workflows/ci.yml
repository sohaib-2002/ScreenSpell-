name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - run: dotnet restore ScreenSpell/ScreenSpell.sln
      - run: dotnet build ScreenSpell/ScreenSpell.sln -c Release --no-restore
      - run: dotnet test ScreenSpell/Tests/ScreenSpell.Tests.csproj -c Release --no-build
